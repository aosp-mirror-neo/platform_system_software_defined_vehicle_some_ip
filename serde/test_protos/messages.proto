syntax = "proto3";

package com.sdv.test;

message ArrayMessage {
  repeated int32 field = 1;
}

message RepeatedStringMessage {
  repeated string field = 1;
}

message TwoDArrayMessage {
  repeated bytes matrix = 1;  // Each 'bytes' entry represents an inner array (e.g., a row)
}

// For testing array of structs
message Point {
  int32 x = 1;
  int32 y = 2;
}

message ArrayOfStructsMessage {
  repeated Point points = 1;
}

message SimpleTestMessage {
  uint64 a = 1;
  double b = 2;
  uint32 c = 3;  // u8
}

message ComplexTestMessage {
  Data a = 1;
}

message Data {
  A a = 1;
  uint32 b = 2;  // u8
  C c = 3;
  uint32 d = 4;
  uint32 e = 5;  // u8
  uint32 f = 6;  // u8
  uint32 g = 7;  // u8
  repeated H h = 8;
}

message A {
  uint32 a = 1;  // u8
  uint32 b = 2;  // u8
  uint32 c = 3;  // u8
}

message C {
  uint32 a = 1;           // u8
  repeated uint32 b = 2;  // u8
}

message H {
  HA a = 1;
  HB b = 2;
  HC c = 3;
  HD d = 4;
  HE e = 5;
  HF f = 6;
  HG g = 7;
  HH h = 8;
}

message HA {
  uint32 a = 1;
  uint32 b = 2;
  uint32 c = 3;
  uint32 d = 4;  // u8
  uint32 e = 5;  // u8
  uint32 f = 6;  // u8
  repeated HAG g = 7;
}

message HAG {
  uint32 a = 1;
  uint32 b = 2;
  uint32 c = 3;  // u8
}

message HB {
  uint32 a = 1;  // u8
  uint32 b = 2;  // u8
  repeated HBC c = 3;
}

message HBC {
  uint32 a = 1;  // u8
  uint32 b = 2;  // u8
}

message HC {
  uint32 a = 1;  // u8
  repeated float b = 2;
  repeated float c = 3;
  float d = 4;
  float e = 5;
}

message HD {
  repeated float a = 1;
  repeated float b = 2;
}

message HE {
  repeated float a = 1;
  repeated float b = 2;
  repeated float c = 3;
  repeated float d = 4;
  float e = 5;
  float f = 6;
  uint32 g = 7;  // u8
}

message HF {
  uint32 a = 1;  // u8
  repeated HFB b = 2;
}

message HFB {
  uint32 a = 1;  // u8
  uint32 b = 2;  // u8
}

message HG {
  uint32 a = 1;  // u8
  repeated float b = 2;
}

message HH {
  float a = 1;
}

message BytesMessage {
  bytes data = 1;
}

message UnsignedPrimitiveArrayMessage {
  repeated uint32 items = 1;
}

message Unsigned8BytePrimitiveArrayMessage {
  repeated uint64 items = 1;
}

message Signed8BytePrimitiveArrayMessage {
  repeated int64 items = 1;
}

message PrimitiveFloatArrayMessage {
  repeated float items = 1;
}

message PrimitiveDoubleArrayMessage {
  repeated double items = 1;
}

message PrimitiveBoolArrayMessage {
  repeated bool items = 1;
}

enum TestEnum {
  FIRST_VALUE = 0;
  SECOND_VALUE = 1;
  THIRD_VALUE = 2;
}

message EnumArrayMessage {
  repeated TestEnum items = 1;
}

message TestStruct {
  string string_field = 1;
  repeated uint32 array_field = 2;
  SimpleTestMessage struct_field = 3;
}