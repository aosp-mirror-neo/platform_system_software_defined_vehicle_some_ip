syntax = "proto3";

package com.sdv.someip;

message RoadInfo {
  uint32 num_vehicles = 1;
  repeated VehicleData vehicle_data = 2;
}

message VehicleData {
  float velocity = 1;
  float acceleration = 2;
  VehicleLane lane = 3;
}

enum VehicleLane {
  UNKNOWN = 0;
  LEFT = 1;
  CURRENT = 2;
  RIGHT = 3;
}